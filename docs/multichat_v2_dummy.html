<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>monarch 0.24.0 – UI dummy: chats side by side</title>
<style>
/* VS Code Dark Modern colors, only for this dummy */
:root {
  --vscode-font-family: -apple-system, "Segoe UI", system-ui, Ubuntu, sans-serif; --vscode-font-size: 13px;
  --vscode-editor-font-family: Consolas, "Courier New", monospace;
  --vscode-foreground: #cccccc; --vscode-sideBar-background: #181818; --vscode-editor-background: #1f1f1f;
  --vscode-panel-border: #2b2b2b; --vscode-editorWidget-background: #202020; --vscode-focusBorder: #0078d4;
  --vscode-sash-hoverBorder: #0078d4; --vscode-input-background: #313131; --vscode-input-foreground: #cccccc;
  --vscode-input-border: #3c3c3c; --vscode-button-background: #0078d4; --vscode-button-foreground: #ffffff;
  --vscode-button-hoverBackground: #026ec1; --vscode-button-secondaryBackground: #313131; --vscode-button-secondaryForeground: #cccccc;
  --vscode-badge-background: #616161; --vscode-badge-foreground: #f8f8f8; --vscode-toolbar-hoverBackground: rgba(90,93,94,.31);
  --vscode-toolbar-activeBackground: rgba(99,102,103,.31); --vscode-dropdown-background: #313131; --vscode-dropdown-border: #3c3c3c;
  --vscode-dropdown-foreground: #cccccc; --vscode-list-hoverBackground: #2a2d2e; --vscode-list-activeSelectionBackground: #04395e;
  --vscode-textLink-foreground: #4daafc; --vscode-textCodeBlock-background: #2b2b2b;
  --vscode-inputValidation-warningBackground: #352a05; --vscode-inputValidation-warningBorder: #b89500;
  --vscode-inputValidation-errorBackground: #5a1d1d; --vscode-inputValidation-errorForeground: #f48771; --vscode-inputValidation-errorBorder: #be1100;
  --pad: 12px; --radius: 8px; --avatar: 24px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); background: #111; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; }
button:disabled { opacity: .5; cursor: not-allowed; }
.hidden { display: none !important; }

/* dummy controls (not part of monarch) */
.dummy { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 6px 12px; background: #3b2e00; color: #f0e2b0; font-size: 12px; border-bottom: 1px solid #6b5500; }
.dummy b { color: #fff; }
.dummy label { display: inline-flex; align-items: center; gap: 4px; }
.dummy select, .dummy button { background: #5a4600; color: #fff; border: 1px solid #8a6d00; border-radius: 3px; padding: 1px 6px; font-size: 12px; }

/* fake VS Code window */
.vsc { flex: 1; display: flex; min-height: 0; }
.activitybar { width: 48px; background: #181818; border-right: 1px solid var(--vscode-panel-border); display: flex; flex-direction: column; align-items: center; padding-top: 8px; gap: 14px; }
.activitybar span { width: 24px; height: 24px; border-radius: 4px; background: #333; }
.activitybar span.on { background: var(--vscode-foreground); box-shadow: -12px 0 0 -10px var(--vscode-foreground); }
.sidebar { display: flex; flex-direction: column; min-width: 340px; background: var(--vscode-sideBar-background); }
.view-title { height: 35px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px 0 20px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.view-title .grow { flex: 1; }
.vsc-sash { width: 4px; cursor: ew-resize; background: var(--vscode-panel-border); flex-shrink: 0; }
.vsc-sash:hover, .vsc-sash.dragging { background: var(--vscode-sash-hoverBorder); }
.editor { flex: 1; min-width: 120px; background: var(--vscode-editor-background); display: flex; align-items: center; justify-content: center; color: #555; font-size: 12px; }

/* monarch webview */
.monarch { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 4px 8px; border-bottom: 1px solid var(--vscode-panel-border); background: var(--vscode-editorWidget-background); }
.main { flex: 1; min-height: 0; display: flex; }
.main.notes-left .notes-pane { order: -1; border-left: none; border-right: 1px solid var(--vscode-panel-border); }
.areas { flex: 1; min-width: 0; display: flex; overflow-x: auto; }
.area { display: flex; flex-direction: column; min-width: 300px; flex-basis: 0; height: 100%; position: relative; }
.area.active { box-shadow: inset 0 2px 0 var(--vscode-focusBorder); }
.area-sash { flex: 0 0 4px; cursor: ew-resize; background: var(--vscode-panel-border); touch-action: none; }
.area-sash:hover, .area-sash.dragging { background: var(--vscode-sash-hoverBorder); }

/* notes */
.notes-pane { flex: 0 0 auto; width: 260px; min-width: 120px; display: flex; flex-direction: column; position: relative; border-left: 1px solid var(--vscode-panel-border); }
.notes-splitter { position: absolute; top: 0; bottom: 0; width: 7px; left: -4px; cursor: ew-resize; z-index: 2; display: flex; justify-content: center; touch-action: none; }
.main.notes-left .notes-splitter { left: auto; right: -4px; }
.notes-splitter::before { content: ''; width: 3px; }
.notes-splitter:hover::before, .notes-splitter.dragging::before { background: var(--vscode-sash-hoverBorder); }
.notes-group { display: flex; flex-direction: column; min-height: 60px; flex-basis: 0; }
.notes-group-head { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-size: .85em; border-bottom: 1px solid var(--vscode-panel-border); }
.notes-group-repo, .notes-group-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notes-group-title { opacity: .6; flex: 1; min-width: 0; }
.notes-group textarea { flex: 1; min-height: 0; width: 100%; resize: none; border: none; padding: var(--pad); background: transparent; color: var(--vscode-input-foreground); font-family: var(--vscode-editor-font-family); font-size: var(--vscode-font-size); }
.notes-group textarea:focus { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
.group-sash { flex: 0 0 4px; cursor: ns-resize; background: var(--vscode-panel-border); touch-action: none; }
.group-sash:hover, .group-sash.dragging { background: var(--vscode-sash-hoverBorder); }

/* buttons, badges, avatars */
.icon-btn { width: 30px; height: 30px; padding: 0; flex-shrink: 0; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--vscode-foreground); opacity: .85; }
.icon-btn:hover:not(:disabled) { background: var(--vscode-toolbar-hoverBackground); opacity: 1; }
.icon-btn.active { opacity: 1; background: var(--vscode-toolbar-activeBackground); }
.icon-btn.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); opacity: 1; }
.icon-btn.primary:hover { background: var(--vscode-button-hoverBackground); }
.icon-btn.small { width: 24px; height: 24px; border-radius: 5px; }
.badge { display: inline-flex; gap: 4px; padding: 1px 8px; border-radius: 10px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); white-space: nowrap; font-size: .85em; }
.badge .label { opacity: .8; }
.avatar { width: var(--avatar); height: var(--avatar); border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: .75em; font-weight: 600; color: #fff; }
.avatar.large { --avatar: 48px; font-size: 1.1em; }

/* messages */
.messages { flex: 1; min-height: 0; overflow-y: auto; padding: var(--pad); display: flex; flex-direction: column; gap: 12px; }
.row.user { display: flex; justify-content: flex-end; }
.row.user .bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; background: var(--vscode-input-background); border: 1px solid var(--vscode-panel-border); }
.turn { display: flex; flex-direction: column; gap: 4px; }
.turn-head { display: flex; align-items: center; gap: 8px; font-size: .85em; }
.turn-head .name { font-weight: 600; } .turn-head .meta { opacity: .6; }
.turn-body { align-self: flex-start; max-width: min(85%, calc(100% - var(--avatar) - 8px)); margin-left: calc(var(--avatar) + 8px); padding: 8px 12px; border-radius: 12px; line-height: 1.5; word-break: break-word; }
.turn-body p { margin-bottom: .5em; } .turn-body p:last-child { margin-bottom: 0; }
.turn-body ul { padding-left: 1.4em; margin: .3em 0; }
.turn-body code { font-family: var(--vscode-editor-font-family); font-size: .9em; background: var(--vscode-textCodeBlock-background); padding: 1px 4px; border-radius: 3px; }
.turn-body pre { background: var(--vscode-textCodeBlock-background); border: 1px solid var(--vscode-panel-border); border-radius: 4px; padding: 8px 10px; overflow-x: auto; margin: .5em 0; font-family: var(--vscode-editor-font-family); font-size: .9em; }
.step { margin-left: calc(var(--avatar) / 2); padding: 1px 0 1px 10px; border-left: 2px solid var(--vscode-panel-border); font-size: .8em; opacity: .7; display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--vscode-foreground); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; opacity: .6; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.message.warning { align-self: center; max-width: 95%; padding: 6px 12px; border-radius: var(--radius); background: var(--vscode-inputValidation-warningBackground); border: 1px solid var(--vscode-inputValidation-warningBorder); font-size: .9em; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 6px; padding: 24px 20px; }
.empty-state .title { font-size: 1.1em; font-weight: 600; margin-top: 6px; }
.empty-state .subtitle { font-size: .85em; opacity: .6; }

/* input */
.input-area { flex-shrink: 0; display: flex; flex-direction: column; }
.splitter { height: 7px; margin-top: -3px; display: flex; align-items: center; cursor: ns-resize; touch-action: none; position: relative; z-index: 1; }
.splitter::before { content: ''; flex: 1; height: 1px; background: var(--vscode-panel-border); }
.splitter:hover::before, .splitter.dragging::before { height: 3px; background: var(--vscode-sash-hoverBorder); }
.input-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 4px var(--pad) 0; position: relative; }
.toolbar-status { display: flex; gap: 4px; min-width: 0; }
.model-wrap { margin-left: auto; min-width: 0; max-width: 100%; }
.picker-btn { display: block; max-width: 100%; height: 26px; line-height: 22px; padding: 2px 8px; border-radius: 3px; background: transparent; color: var(--vscode-foreground); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .8; }
.picker-btn:hover { background: var(--vscode-toolbar-hoverBackground); opacity: 1; }
.attachments { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px var(--pad) 0; }
.attachments:empty { display: none; }
.chip { background: var(--vscode-button-background); color: var(--vscode-button-foreground); padding: 1px 8px; border-radius: 10px; font-size: .85em; }
.input-editor-wrap { padding: 4px var(--pad) 0; display: flex; }
.input-editor-wrap textarea { flex: 1; resize: none; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border); border-radius: 6px; padding: 8px 10px; font-family: inherit; font-size: inherit; line-height: 1.4; outline: none; }
.input-editor-wrap textarea:focus { border-color: var(--vscode-focusBorder); }
.bottom-row { display: flex; align-items: center; gap: 2px; padding: 4px var(--pad) 10px; }
.bottom-row .grow { flex: 1; }
.repo-btn { display: flex; align-items: center; gap: 5px; max-width: 45%; height: 24px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: transparent; color: inherit; font-size: .85em; padding: 0 6px; border-radius: 4px; }
.repo-btn:hover:not(:disabled) { background: var(--vscode-toolbar-hoverBackground); }
.repo-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.send-btn, .stop-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 60px; height: 26px; padding: 0 14px; border-radius: 12px; font-weight: 500; }
.send-btn { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
.send-btn:hover { background: var(--vscode-button-hoverBackground); }
.stop-btn { background: var(--vscode-inputValidation-errorBackground); color: var(--vscode-inputValidation-errorForeground); border: 1px solid var(--vscode-inputValidation-errorBorder); }

/* menus */
.menu-wrap { position: relative; }
.input-toolbar .menu-wrap { position: static; }
.menu { position: absolute; top: 100%; left: 0; margin-top: 4px; min-width: 220px; max-width: min(340px, calc(100vw - 16px)); max-height: 60vh; overflow-y: auto; background: var(--vscode-dropdown-background); border: 1px solid var(--vscode-dropdown-border); border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.4); z-index: 100; padding: 4px 0; font-size: 12px; }
.menu.right { left: auto; right: 0; }
.menu.up { top: auto; bottom: 100%; margin: 0 0 4px; }
.input-toolbar .menu.up.right { right: var(--pad); left: auto; }
.menu-header { padding: 6px 10px 2px; font-size: .8em; text-transform: uppercase; letter-spacing: .05em; opacity: .6; }
.menu-separator { border-top: 1px solid var(--vscode-panel-border); margin: 4px 0; }
.menu-note { padding: 6px 10px; opacity: .6; }
.menu-item { display: flex; align-items: center; gap: 6px; padding: 5px 10px; cursor: pointer; color: var(--vscode-dropdown-foreground); }
.menu-item:hover { background: var(--vscode-list-hoverBackground); }
.menu-item.disabled { opacity: .45; cursor: not-allowed; }
.menu-item.disabled:hover { background: transparent; }
.menu-item.selected { color: var(--vscode-textLink-foreground); }
.menu-item .check { width: 14px; text-align: center; flex-shrink: 0; }
.menu-item .item-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-item .item-meta { font-size: .85em; opacity: .6; white-space: nowrap; }
.item-remove { opacity: 0; padding: 0 4px; border-radius: 3px; }
.menu-item:hover .item-remove { opacity: .7; }
.agent-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px 8px; }
.agent-circle { padding: 0; background: transparent; border-radius: 50%; border: 2px solid transparent; line-height: 0; opacity: .75; }
.agent-circle:hover { opacity: 1; }
.agent-circle.selected { border-color: var(--vscode-focusBorder); opacity: 1; }
.agent-circle .avatar { --avatar: 42px; }
.levels { display: flex; gap: 4px; padding: 2px 10px 6px 30px; }
.level { padding: 1px 8px; border-radius: 10px; background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); font-size: .9em; }
.level.selected { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
.menu-filter { display: block; width: calc(100% - 12px); margin: 4px 6px; padding: 4px 6px; color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border); font: inherit; outline: none; }
.menu-filter:focus { border-color: var(--vscode-focusBorder); }
.tip { position: fixed; z-index: 200; padding: 3px 7px; background: #252526; border: 1px solid #454545; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div class="dummy">
  <b>UI dummy · monarch 0.24.0 · chats side by side</b>
  <span>Only for the look; no awork connection.</span>
  <label>Notes position <select id="d_notes_pos"><option value="right">right</option><option value="left">left</option></select></label>
  <label><input type="checkbox" id="d_staged"> files staged (active chat)</label>

</div>
<div class="vsc">
  <div class="activitybar"><span></span><span></span><span></span><span class="on"></span></div>

    <div class="monarch">

        <button class="icon-btn" id="notes_toggle" title="Show or hide notes"><svg viewBox="0 0 16 16" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 2.5h6l3 3v8h-9z"/><path d="M9.5 2.5v3h3"/><path d="M5.5 8.5h5M5.5 11h3.5"/></svg></button>

        <div class="menu-wrap"><button class="icon-btn primary" id="new_chat" title="New chat"><svg viewBox="0 0 16 16" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg></button><div class="menu right hidden" id="new_menu"></div></div>

<template id="area_template">

        <button class="icon-btn small" data-el="terminal" title="Terminal for this repo"><svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h11v9h-11z"/><path d="M5 6.5l2 1.5-2 1.5"/><path d="M8.5 10h2.5"/></svg></button>

<script>
'use strict';
// ---------- static sample data ----------
const max_areas = 4, min_area_px = 300, min_group_px = 60;
const agents = [
  { id: 'cz', name: 'CodeZilla', ini: 'CZ', color: '#2e7d32', model: 'GPT-5', level: 'High' },

  { name: 'Claude Sonnet 4.5', factor: '1x', levels: [] },

const repos = [
  { name: 'Monarch', color: '#4ec9b0' }, { name: 'es-toolbox', color: '#c586c0' },

  { id: 3, agent: 'cz', repo: 'ES-Search', title: 'Index mapping review', notes: '', credits: 64, co_credits: 12, messages: [
    { role: 'user', text: 'Prüf bitte das Mapping für die Proxy-Felder.' },
    { role: 'agent', meta: 'gestern · 2m 03s', html: '<p>Zwei Felder sind als <code>text</code> statt <code>keyword</code> gemappt. Details im Pflichtenheft.</p>' } ] },
];

// ---------- layout helpers (same contract as media/chat_layout.js) ----------
const equal_sizes = count => Array.from({ length: count }, () => 1 / count);
function drag_split(sizes, index, delta_px, total_px, min_px) {
  const px = sizes.map(size => size * total_px), pair = px[index] + px[index + 1];
  px[index] = Math.max(min_px, Math.min(pair - min_px, px[index] + delta_px));
  px[index + 1] = pair - px[index];
  return px.map(value => value / total_px);
}
const next_active = (ids, removed_id, active_id) => {
  if (removed_id !== active_id) return active_id;
  const index = ids.indexOf(removed_id);
  return ids[index - 1] ?? ids[index + 1];
};

// ---------- state ----------
let chats, areas, active_id, area_sizes, group_sizes, next_chat_id, input_height, notes_width;
const agent_of = id => agents.find(agent => agent.id === id);
const chat_of = id => chats.find(chat => chat.id === id);
const area_of = id => areas.find(area => area.id === id);
const active_area = () => area_of(active_id);
const can_change = area => !area.working && !area.staged;
const $ = id => document.getElementById(id);

function reset() {
  chats = sample_chats(); next_chat_id = 4; input_height = 84; notes_width = 260;
  areas = []; active_id = null; $('areas').replaceChildren();
  for (const chat_id of [1, 2]) add_area(chat_id);
  set_active(areas[0].id);
  $('notes_pane').classList.remove('hidden'); $('notes_toggle').classList.add('active');
  render_notes();
}

// ---------- areas ----------
let area_seq = 0;
function add_area(chat_id) {
  const root = $('area_template').content.firstElementChild.cloneNode(true);
  const el = name => root.querySelector(`[data-el="${name}"]`);
  const chat = chat_of(chat_id);
  const area = { id: ++area_seq, chat_id, root, el, working: false, staged: false, model: null, level: null, timer: null };
  areas.push(area);
  el('input').style.height = `${input_height}px`;
  if (chat_id === 1) el('attachments').innerHTML = '<span class="chip">docs/multichat_v2.md</span>';
  wire_area(area);
  area_sizes = equal_sizes(areas.length);
  render_areas_dom(); render_area(area); render_notes();
  return area;
}

function remove_area(area) {
  clearTimeout(area.timer);
  const ids = areas.map(item => item.id);
  const new_active = next_active(ids, area.id, active_id);
  areas = areas.filter(item => item !== area);
  area.root.remove();
  area_sizes = equal_sizes(areas.length);
  render_areas_dom(); set_active(new_active); render_notes();
}

function render_areas_dom() {
  const box = $('areas');
  box.replaceChildren();
  areas.forEach((area, index) => {
    if (index) box.appendChild(make_sash('area-sash', 'x', index - 1, () => area_sizes, sizes => { area_sizes = sizes; apply_area_sizes(); }, () => areas.map(item => item.root.getBoundingClientRect().width), min_area_px));
    box.appendChild(area.root);
  });
  apply_area_sizes();
  areas.forEach(render_area);
}
const apply_area_sizes = () => areas.forEach((area, index) => area.root.style.flexGrow = area_sizes[index]);

function set_active(id) {
  active_id = id;
  for (const area of areas) area.root.classList.toggle('active', areas.length > 1 && area.id === id);
  $('d_staged').checked = !!active_area()?.staged;
}

// generic sash: changes only the two neighbours
function make_sash(class_name, axis, index, get_sizes, set_sizes, get_px, min_px) {
  const sash = Object.assign(document.createElement('div'), { className: class_name });
  sash.addEventListener('pointerdown', event => {
    event.preventDefault(); sash.setPointerCapture(event.pointerId); sash.classList.add('dragging');
    const start = axis === 'x' ? event.clientX : event.clientY, start_sizes = get_sizes().slice();
    const total = get_px().reduce((sum, value) => sum + value, 0);
    const move = moved => set_sizes(drag_split(start_sizes, index, (axis === 'x' ? moved.clientX : moved.clientY) - start, total, min_px));
    const up = () => { sash.classList.remove('dragging'); sash.removeEventListener('pointermove', move); sash.removeEventListener('pointerup', up); };
    sash.addEventListener('pointermove', move); sash.addEventListener('pointerup', up);
  });
  return sash;
}

function effective(area) {
  const chat = chat_of(area.chat_id), agent = agent_of(chat.agent);
  return { chat, agent, model: area.model ?? agent.model, level: area.model ? area.level : agent.level };
}

function render_area(area) {
  const { chat, agent, model, level } = effective(area), el = area.el, unknown = $('d_unknown').checked;
  el('model').textContent = [agent.name, model, level].filter(Boolean).join(' · ');
  const value = number => unknown ? '?' : number;
  const co = area.working ? `${value(2)} · ${value(1)} working` : value(0);
  el('status').innerHTML = `<span class="badge"><span class="label">Chat</span>${value(chat.credits)}</span><span class="badge"><span class="label">Co-Credits</span>${value(chat.co_credits)}</span><span class="badge"><span class="label">Co-Agenten</span>${co}</span>`;
  const repo = repos.find(item => item.name === chat.repo);
  el('repo_dot').style.background = repo.color; el('repo_name').textContent = repo.name;
  el('repo').disabled = !can_change(area);
  const close = el('close');
  close.classList.toggle('hidden', areas.length < 2);
  close.disabled = !can_change(area);
  close.title = can_change(area) ? 'Close this chat (it stays in History)' : 'Close the chat when the agent has finished and no files are staged.';
  el('send').classList.toggle('hidden', area.working); el('stop').classList.toggle('hidden', !area.working);
  render_messages(area);
}

function avatar_node(agent, large) {
  return Object.assign(document.createElement('span'), { className: `avatar${large ? ' large' : ''}`, textContent: agent.ini, style: `background:${agent.color}` });
}

function render_messages(area) {
  const { chat, agent } = effective(area), box = area.el('messages');
  box.replaceChildren();
  if (!chat.messages.length) {
    const empty = Object.assign(document.createElement('div'), { className: 'empty-state' });
    empty.append(avatar_node(agent, true));
    empty.insertAdjacentHTML('beforeend', `<div class="title">${agent.name}</div><div class="subtitle">Start a conversation below.</div>`);
    return box.append(empty);
  }
  for (const item of chat.messages) {
    if (item.role === 'user') { box.insertAdjacentHTML('beforeend', '<div class="row user"><div class="bubble"></div></div>'); box.lastElementChild.firstChild.textContent = item.text; continue; }
    if (item.role === 'notice') { box.insertAdjacentHTML('beforeend', `<div class="message warning">${item.text}</div>`); continue; }
    const turn = Object.assign(document.createElement('div'), { className: 'turn' });
    const head = Object.assign(document.createElement('div'), { className: 'turn-head' });
    head.append(avatar_node(agent));
    head.insertAdjacentHTML('beforeend', `<span class="name">${agent.name}</span><span class="meta">${item.meta}</span>`);
    turn.append(head);
    turn.insertAdjacentHTML('beforeend', `<div class="turn-body">${item.html}</div>`);
    box.append(turn);
  }
  if (area.working) box.insertAdjacentHTML('beforeend', `<div class="step"><span class="spinner"></span><span>${area.step}</span></div>`);
  box.scrollTop = box.scrollHeight;
}

function notice(area, text) {
  const box = area.el('messages'), node = Object.assign(document.createElement('div'), { className: 'message warning', textContent: text });
  box.append(node); box.scrollTop = box.scrollHeight;
  setTimeout(() => node.remove(), 3500);
}

// ---------- per-area interaction ----------
function wire_area(area) {
  const el = area.el;
  area.root.addEventListener('pointerdown', () => set_active(area.id), true);
  area.root.addEventListener('focusin', () => set_active(area.id));
  el('send').addEventListener('click', () => send(area));
  el('stop').addEventListener('click', () => { clearTimeout(area.timer); area.working = false; chat_of(area.chat_id).messages.push({ role: 'notice', text: 'Stopped.' }); render_area(area); });
  el('input').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(area); } });
  el('terminal').addEventListener('click', () => notice(area, `Terminal opens in the panel for ${chat_of(area.chat_id).repo}.`));
  el('attach').addEventListener('click', () => notice(area, 'Attach menu as today.'));
  el('close').addEventListener('click', () => can_change(area) && remove_area(area));
  el('model').addEventListener('click', event => { event.stopPropagation(); toggle_menu(el('model_menu'), () => render_model_menu(area)); });
  el('repo').addEventListener('click', event => { event.stopPropagation(); toggle_menu(el('repo_menu'), () => render_repo_menu(area)); });
  el('splitter').addEventListener('pointerdown', event => {
    event.preventDefault(); const splitter = el('splitter'), input = el('input');
    splitter.setPointerCapture(event.pointerId); splitter.classList.add('dragging');
    const start = event.clientY, start_h = input.offsetHeight;
    const move = moved => { input_height = Math.max(60, Math.min(area.root.offsetHeight - 220, start_h + start - moved.clientY)); input.style.height = `${input_height}px`; };
    const up = () => { splitter.classList.remove('dragging'); splitter.removeEventListener('pointermove', move); splitter.removeEventListener('pointerup', up); };
    splitter.addEventListener('pointermove', move); splitter.addEventListener('pointerup', up);
  });
}

function send(area) {
  const input = area.el('input'), text = input.value.trim();
  if (!text || area.working) return;
  const chat = chat_of(area.chat_id);
  chat.messages.push({ role: 'user', text }); input.value = '';
  if (chat.title === 'New chat') chat.title = text.slice(0, 32);
  area.working = true; area.step = 'Reading repo snapshot …'; render_area(area); render_notes();
  area.timer = setTimeout(() => {
    area.step = 'Waiting for co-agents (2 working) …'; render_area(area);
    area.timer = setTimeout(() => {
      area.working = false; chat.credits += 7; chat.co_credits += 21;
      chat.messages.push({ role: 'agent', meta: 'now · 6s', html: '<p>Dummy answer. Close and repo change are locked while I was working.</p>' });
      render_area(area);
    }, 3000);
  }, 2500);
}

// ---------- menus ----------
const all_menus = () => document.querySelectorAll('.menu');
const close_menus = () => all_menus().forEach(menu => menu.classList.add('hidden'));
function toggle_menu(menu, render) {
  const open = menu.classList.contains('hidden');
  close_menus();
  if (!open) return;
  render(); menu.classList.remove('hidden');
}
document.addEventListener('click', event => { if (!event.target.closest('.menu')) close_menus(); });

function menu_item(label, meta, { selected, disabled, check, action, extra } = {}) {
  const item = Object.assign(document.createElement('div'), { className: `menu-item${selected ? ' selected' : ''}${disabled ? ' disabled' : ''}` });
  item.innerHTML = `<span class="check">${check ?? (selected ? '✓' : '')}</span><span class="item-label"></span><span class="item-meta"></span>`;
  item.children[1].textContent = label; item.children[2].textContent = meta || '';
  if (extra) item.append(extra);
  item.addEventListener('click', event => { event.stopPropagation(); if (!disabled) { close_menus(); action?.(event); } });
  return item;
}
const header_node = text => Object.assign(document.createElement('div'), { className: 'menu-header', textContent: text });
const separator_node = () => Object.assign(document.createElement('div'), { className: 'menu-separator' });

function render_model_menu(area) {
  const menu = area.el('model_menu'), { agent, model, level } = effective(area);
  const row = Object.assign(document.createElement('div'), { className: 'agent-row' });
  for (const item of agents) {
    const circle = Object.assign(document.createElement('button'), { className: `agent-circle${item.id === agent.id ? ' selected' : ''}`, title: item.name });
    circle.append(avatar_node(item));
    circle.addEventListener('click', event => {
      event.stopPropagation(); close_menus();
      if (area.working) return notice(area, 'Stop the agent first.');
      chat_of(area.chat_id).agent = item.id; area.model = null; render_area(area); render_notes();
    });
    row.append(circle);
  }
  const nodes = [header_node('Agent'), row, separator_node(),
    menu_item('Agent default', [agent.model, agent.level].filter(Boolean).join(' · '), { selected: !area.model, action: () => { area.model = null; render_area(area); } })];
  const levels = models.find(item => item.name === model).levels;
  if (levels.length) {
    const level_row = Object.assign(document.createElement('div'), { className: 'levels' });
    for (const name of levels) {
      const button = Object.assign(document.createElement('button'), { className: `level${name === level ? ' selected' : ''}`, textContent: name });
      button.addEventListener('click', event => { event.stopPropagation(); area.model = model; area.level = name; close_menus(); render_area(area); });
      level_row.append(button);
    }
    nodes.push(separator_node(), header_node('Reasoning'), level_row);
  }
  nodes.push(separator_node(), header_node('AI models'));
  for (const item of models) nodes.push(menu_item(item.name, item.factor, { selected: !!area.model && item.name === model, action: () => { area.model = item.name; area.level = item.levels.includes(level) ? level : item.levels.at(-1) ?? null; render_area(area); } }));
  menu.replaceChildren(...nodes);
}

function render_repo_menu(area) {
  const menu = area.el('repo_menu'), filter = Object.assign(document.createElement('input'), { className: 'menu-filter', placeholder: 'Filter repos …' });
  const list = document.createElement('div');
  const fill = () => list.replaceChildren(...repos.filter(repo => repo.name.toLowerCase().includes(filter.value.toLowerCase())).map(repo => {
    const dot = `<span class="repo-dot" style="background:${repo.color}"></span>`;
    const item = menu_item(repo.name, '', { selected: repo.name === chat_of(area.chat_id).repo, check: '', action: () => { chat_of(area.chat_id).repo = repo.name; render_area(area); render_notes(); } });
    item.children[0].innerHTML = dot;
    return item;
  }));
  filter.addEventListener('click', event => event.stopPropagation());
  filter.addEventListener('input', fill);
  fill(); menu.replaceChildren(filter, list);
  setTimeout(() => filter.focus());
}

function render_history() {
  const area = active_area(), agent = effective(area).agent;
  const items = chats.filter(chat => chat.agent === agent.id).map(chat => {
    const open_in = areas.find(item => item.chat_id === chat.id);
    const remove = Object.assign(document.createElement('span'), { className: 'item-remove', textContent: '✕', title: 'Remove from history (stays in awork)' });
    remove.addEventListener('click', event => { event.stopPropagation(); if (open_in) return; chats = chats.filter(item => item !== chat); render_history(); });
    const meta = [chat.repo, open_in && open_in !== area ? 'open' : ''].filter(Boolean).join(' · ');
    return menu_item(chat.title, meta, { selected: open_in === area, extra: remove, action: () => {
      if (open_in) return set_active(open_in.id);
      if (!can_change(area)) return notice(area, 'Stop the agent first.');
      area.chat_id = chat.id; area.model = null; render_area(area); render_notes();
    } });
  });
  $('history_menu').replaceChildren(header_node(`Chat history · ${agent.name}`), ...(items.length ? items : [Object.assign(document.createElement('div'), { className: 'menu-note', textContent: 'No chats yet.' })]));
}

function render_new_menu() {
  const full = areas.length >= max_areas;
  $('new_menu').replaceChildren(
    menu_item('New chat here', '', { action: () => {
      const area = active_area();
      if (!can_change(area)) return notice(area, 'Stop the agent first.');
      area.chat_id = new_chat(effective(area).chat).id; area.model = null; render_area(area); render_notes();
    } }),
    menu_item('New chat right', full ? 'max. 4' : '', { disabled: full, action: () => {
      const area = add_area(new_chat(effective(active_area()).chat).id);
      set_active(area.id); area.el('input').focus();
    } }));
}
function new_chat(template) {
  const chat = { id: next_chat_id++, agent: template.agent, repo: template.repo, title: 'New chat', notes: '', credits: 0, co_credits: 0, messages: [] };
  chats.unshift(chat);
  return chat;
}

$('history').addEventListener('click', event => { event.stopPropagation(); toggle_menu($('history_menu'), render_history); });
$('new_chat').addEventListener('click', event => {
  event.stopPropagation();
  if (event.ctrlKey || event.metaKey) { close_menus(); return notice(active_area(), 'Ctrl/Cmd+click: take over a chat from awork (as today).'); }
  toggle_menu($('new_menu'), render_new_menu);
});

// ---------- notes ----------
function render_notes() {
  const box = $('notes_groups');
  group_sizes = equal_sizes(areas.length);
  box.replaceChildren();
  areas.forEach((area, index) => {
    const chat = chat_of(area.chat_id), repo = repos.find(item => item.name === chat.repo);
    if (index) box.append(make_sash('group-sash', 'y', index - 1, () => group_sizes, sizes => { group_sizes = sizes; apply_group_sizes(); }, () => [...box.querySelectorAll('.notes-group')].map(node => node.getBoundingClientRect().height), min_group_px));
    const group = Object.assign(document.createElement('div'), { className: 'notes-group' });
    if (areas.length > 1) {
      group.insertAdjacentHTML('beforeend', `<div class="notes-group-head"><span class="repo-dot" style="background:${repo.color}"></span><span class="notes-group-repo"></span><span class="notes-group-title"></span></div>`);
      group.querySelector('.notes-group-repo').textContent = repo.name; group.querySelector('.notes-group-title').textContent = chat.title;
    }
    const text = Object.assign(document.createElement('textarea'), { value: chat.notes, placeholder: 'Notes for this chat …', spellcheck: false });
    text.addEventListener('input', () => chat.notes = text.value);
    group.append(text); box.append(group);
  });
  apply_group_sizes();
}
const apply_group_sizes = () => [...$('notes_groups').querySelectorAll('.notes-group')].forEach((group, index) => group.style.flexGrow = group_sizes[index]);

$('notes_toggle').addEventListener('click', () => $('notes_toggle').classList.toggle('active', !$('notes_pane').classList.toggle('hidden')));
$('notes_splitter').addEventListener('pointerdown', event => {
  event.preventDefault(); const splitter = $('notes_splitter'), pane = $('notes_pane');
  splitter.setPointerCapture(event.pointerId); splitter.classList.add('dragging');
  const start = event.clientX, start_w = pane.offsetWidth, sign = $('main').classList.contains('notes-left') ? 1 : -1;
  const move = moved => { notes_width = Math.max(120, Math.min(600, start_w + sign * (moved.clientX - start))); pane.style.width = `${notes_width}px`; };
  const up = () => { splitter.classList.remove('dragging'); splitter.removeEventListener('pointermove', move); splitter.removeEventListener('pointerup', up); };
  splitter.addEventListener('pointermove', move); splitter.addEventListener('pointerup', up);
});

// ---------- VS Code frame and dummy controls ----------
const sidebar = $('sidebar');
sidebar.style.width = `${Math.round(window.innerWidth * 0.78)}px`;
$('vsc_sash').addEventListener('pointerdown', event => {
  event.preventDefault(); const sash = $('vsc_sash');
  sash.setPointerCapture(event.pointerId); sash.classList.add('dragging');
  const start = event.clientX, start_w = sidebar.offsetWidth;
  const move = moved => sidebar.style.width = `${Math.max(340, Math.min(window.innerWidth - 220, start_w + moved.clientX - start))}px`;
  const up = () => { sash.classList.remove('dragging'); sash.removeEventListener('pointermove', move); sash.removeEventListener('pointerup', up); };
  sash.addEventListener('pointermove', move); sash.addEventListener('pointerup', up);
});
$('d_notes_pos').addEventListener('change', event => $('main').classList.toggle('notes-left', event.target.value === 'left'));
$('d_staged').addEventListener('change', event => { const area = active_area(); area.staged = event.target.checked; render_area(area); });
$('d_unknown').addEventListener('change', () => areas.forEach(render_area));
$('d_reset').addEventListener('click', () => { areas?.forEach(area => clearTimeout(area.timer)); reset(); });
reset();
</script>
</body>
</html>
